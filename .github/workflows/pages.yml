name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checked build
        run: npm run check

      - name: Generate public build status
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const pkg = JSON.parse(await readFile("package.json", "utf8"));
            const info = {
              version: pkg.version,
              commit: process.env.BUILD_SHA.slice(0, 12),
              ref: process.env.BUILD_REF,
              builtAt: new Date().toISOString(),
              testStatus: "passed",
              testCommand: "npm run check",
              run: Number(process.env.BUILD_RUN_NUMBER),
              workflowUrl: `https://github.com/${process.env.BUILD_REPOSITORY}/actions/runs/${process.env.BUILD_RUN_ID}`,
            };
            await writeFile("examples/full-demo/build-info.json", `${JSON.stringify(info, null, 2)}\n`);
          '

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
