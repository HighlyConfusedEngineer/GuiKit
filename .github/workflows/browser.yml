name: Browser tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm exec --yes --package=@playwright/test playwright install --with-deps chromium
      - run: npm exec --yes --package=@playwright/test playwright test
