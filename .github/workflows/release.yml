name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic version tag to release (for example, v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate tag and package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a semantic version beginning with v."
            exit 1
          fi

          version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run project checks
        run: npm run check

      - name: Validate Python host
        run: python -m py_compile examples/python/app.py

      - name: Build Python wheel with bundled assets
        run: |
          python -m pip install --disable-pip-version-check build
          npm run package:python

      - name: Build .NET NuGet package with bundled assets
        run: dotnet pack packages/dotnet/GuiKit.WebView/GuiKit.WebView.csproj --configuration Release -p:PackageOutputPath=release/dotnet -p:PackageVersion=${{ steps.package.outputs.version }}

      - name: Build installable package
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          archive="$(npm pack --ignore-scripts --pack-destination release --json \
            | node --input-type=module -e \
              "let value=''; for await (const chunk of process.stdin) value += chunk; console.log(JSON.parse(value)[0].filename)")"
          release_name="GuiKit-${{ steps.package.outputs.version }}.tgz"
          mv "release/$archive" "release/$release_name"
          sha256sum "release/$release_name" release/python/*.whl release/dotnet/*.nupkg > release/SHA256SUMS.txt
          echo "path=release/$release_name" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - name: Retain workflow package
        uses: actions/upload-artifact@v4
        with:
          name: GuiKit-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.archive.outputs.path }}
            release/python/*.whl
            release/dotnet/*.nupkg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${{ steps.package.outputs.prerelease }}" == "true" ]]; then
            prerelease+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            "${{ steps.archive.outputs.path }}#Installable npm package" \
            release/python/*.whl \
            release/dotnet/*.nupkg \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
