name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run checks
        run: npm run check

      - name: Validate package contents
        run: npm run release:check

      - name: Validate Python example
        run: python -m py_compile examples/python/app.py

      - name: Build Python wheel with bundled assets
        run: |
          python -m pip install --disable-pip-version-check build
          npm run package:python

      - name: Build .NET NuGet package with bundled assets
        run: npm run package:dotnet
